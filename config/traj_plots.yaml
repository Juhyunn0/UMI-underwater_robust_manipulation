# traj_plots.yaml — which pool runs become presentation figures.
#
#     ./c3 plots                  # this file
#     ./c3 plots --list           # 뭘 그릴지만 먼저 본다
#
# 적을 것은 날짜뿐이다.
#
#     20260814          그 날 전부
#     20260814_2120     그 런 폴더만
#     20260823_195927   그 CSV 하나만
#     all | latest
#
# 그림은 figures/trajectories/<날짜>/<날짜>_<런>_<컨트롤러>_<시분초>.png 로 떨어진다.
# 선은 시간에 따라 밝음→어두움으로 물든다(파랑=기체, 주황=추적 물체). 나머지
# 손잡이(축 박스, segment, error, object 필터, time_color, theme, ...)는 전부
# 코드의 기본값이고 필요하면 여기에 키를 더하거나 CLI로 덮으면 된다 —
# `./c3 plots --help`.
#
# 런은 data/<날짜>/<런>/ 에서 찾는다(rov_gui/runstore.py, 2026-09-14 단일 루트).
# 물속 런만 그린다 — 같은 날짜 폴더의 `_observe`(LOW None, 명령 없음) /
# `_landdry`(육상 벤치) / `_dryrun`(합성 플랜트) 런은 건너뛴다. 그쪽을 그리려면
# `kind: observe` 처럼 종류를 적는다.

