# Maximum-resolution profile. Everything not stated here comes from pipeline.yaml.
#
#     python -m umi_handheld.record --source device --config configs/pipeline_maxres.yaml
#
# This profile maximises resolution at the cost of close range. It is the opposite
# corner from the default profile, and the two are not interchangeable:
#
#                        default (pipeline.yaml)      this profile
#   mono left/right      640 x 400                    1280 x 800
#   depth                320 x 200                    1280 x 800     (16x the samples)
#   colour               1280 x 800                   1280 x 800     (sensor maximum)
#   frame rate           30 fps                       29 fps
#   MinZ                 112.3 mm                     449.0 mm       <-- the price
#
# Close range is the ONLY price. This profile ran at ~9 fps until 2026-08-04, and that
# was believed to be what honest depth costs at 1280x800; it was not. The whole cost was
# the speckle filter, and the median filter does the same job here for free — see the
# table in stereo_depth below.
#
# MinZ = fx * B / d_max, and the disparity search is a FIXED 95 px (190 with extended)
# regardless of resolution — measured, getMaxDisparity() is identical at 400p/720p/800p.
# Doubling the image width doubles fx, so it doubles MinZ; dropping extended doubles it
# again. 283.19*0.075317/190 = 112.3 mm, 566.38*0.075317/95 = 449.0 mm.
#
# disparity_shift can buy the near range back, but only by giving up the far range:
# measured MaxZ = fx*B/shift, so 800p at shift 95 reaches ~112 mm near but caps out at
# 447 mm far. That is unusable against zarr.z_far_m = 2.0, which is why this profile
# does not use it.
#
# USE THIS WHEN the demonstration keeps the gripper beyond ~0.5 m and you want the
# detail. Do NOT use it for close handheld work: below 449 mm this profile returns
# nothing at all, and that is exactly where a UMI gripper lives.

extends: pipeline.yaml

schema: umi_handheld_pipeline/1
profile: maxres

record:
  fps: 30.0
  mono_fps: 30.0
  colour:
    enable: true
    resolution: "800p"        # 1280x800 is the OV9782 maximum; the device reports no
                              # larger config for CAM_A, so colour is already maxed
                              # in the default profile too.
    encode: mjpeg
    quality: 97
  # 4 PNG-sized frames per tick at 1280x800 is 4x the default profile's pixel budget.
  writer:
    workers: 6
    queue_depth: 128
  stereo_depth:
    mono_resolution: "800p"           # 1280x800, the sensor maximum
    extended_disparity: false         # standard 95 px search, as asked
    #
    # valid% is density, NOT quality: optimising it selects for confident mismatches.
    # The first draft of this profile turned off the filters that were "costing valid%"
    # and hit 30 fps with the highest density and the worst of every quality measure —
    # a 33 mm median step between neighbouring pixels on a flat floor. Sweep 1
    # (2026-08-04, one static scene, one run) therefore chose speckle + subpixel:
    #
    #   config                            valid%  tstd  rough   tail    fps
    #   no speckle, no subpixel  (draft)   36.9%  87.2   33.0  29.0%   30.0   <- garbage
    #   + speckle                          11.2%  55.4    8.0   8.3%    8.7
    #   + speckle + subpixel                9.1%  16.3    7.0   8.4%    8.8
    #   + speckle + subpixel + spatial 3   13.1%  51.6    1.0   3.1%    6.4
    #   (400p default profile, reference)  15.2% 121.8    0.0  13.9%   30.0
    #
    #   tstd  = median per-pixel std over time on a STATIC scene (mm). Real depth is
    #           steady; a mismatch re-rolls every frame.
    #   rough = median |depth step| between horizontally adjacent valid pixels (mm).
    #   tail  = share of adjacent pairs jumping more than 100 mm.
    #
    # That reading was right about the draft and wrong about the price. The 8.8 fps was
    # not what quality costs — it was what SPECKLE REMOVAL costs, and nothing else.
    # Sweep 2 (2026-08-04, umi_handheld/bench_stereo.py --sweep cost, device
    # 14442C10716DBCD600, 7 s per row) isolated it one knob at a time:
    #
    #   as configured (speckle on)   8.43 fps        - speckle          30.00 fps
    #   - colour stream              8.43 fps        - temporal          8.43 fps
    #   shaves 8 / slices 6          9.00 fps        speckle_range 5     8.43 fps
    #
    # Neither more compute nor a smaller speckle window helps; the filter itself is the
    # cost. And the MEDIAN filter removes the same isolated mismatches for free
    # (bench_stereo.py --sweep median, same session):
    #
    #   config                            valid%  tstd  rough   tail    fps
    #   speckle (the old setting)          61.5%  39.2   20.0   7.5%    8.43
    #   no filter at all (= test_oak)      59.3%  61.4   16.0  10.2%   29.86
    #   median 3x3                         67.5%  30.8    8.0   4.3%   29.00
    #   median 5x5                         65.7%  28.4    6.0   3.0%   29.14
    #   median 7x7                         64.6%  24.7    5.0   2.2%   29.00   <- chosen
    #
    # 7x7 beats the speckle setting on every quality measure at 3.4x the frame rate, so
    # this is not a trade. Density is not comparable to sweep 1 above: different scene.
    #
    # WHY THIS IS AVAILABLE HERE AND NOT IN pipeline.yaml. The median filter supports at
    # most 1024 disparity levels. The default profile runs extended x subpixel =
    # 95*2*8 = 1520 and the device refuses it, which is why median_filter is "off"
    # there. This profile has extended off, so 95*8 = 760 and median is legal. The
    # setting was inherited through `extends:` without its reason, and stayed off.
    #
    #  - subpixel is still the single biggest stability win: tstd 55.4 -> 16.3 mm in
    #    sweep 1, for free (8.7 -> 8.8 fps). It costs 2 points of density, which is why
    #    counting density alone rejected it. Keep it on — it is also what keeps the
    #    level count at 760 rather than 95, without pushing past the median's limit.
    subpixel: true
    # 760 disparity levels (95 x 8 subpixel) is under the median's 1024 ceiling. Turning
    # extended_disparity on would make it 1520 and the device would reject this, logging
    # an error every frame — see the note above.
    median_filter: "7x7"
    confidence_threshold: 245
    post_processing:
      decimation: {factor: 1, mode: non_zero_median}   # keep depth at full 1280x800
      # OFF, and the median filter above does its job instead: 3.4x the frame rate and
      # better on every quality measure. Do not re-enable without re-running
      # `bench_stereo.py --sweep median` — turning this back on costs 20 fps.
      speckle:   {enable: false, speckle_range: 28, difference_threshold: 2}
      temporal:  {enable: true,  alpha: 0.4, delta: 20}   # measured free (8.43 -> 8.43)
      # Off by choice, and it is a genuine trade rather than a clear win either way:
      # enabling it measured the smoothest depth of anything tested (rough 7.0 -> 1.0,
      # tail 8.4% -> 3.1%) but WORSE temporal stability (tstd 16.3 -> 51.6) and 6.4 fps
      # instead of 8.8. Hole filling invents values that then flicker. Turn it on for
      # single-frame geometry, leave it off for a sequence.
      spatial:   {enable: false, hole_filling_radius: 3, num_iterations: 1,
                  alpha: 0.5, delta: 20}
      # Deliberately BELOW the derived MinZ, so every recording re-measures the floor
      # instead of hiding it. The default profile proves this works: with the floor at
      # 100 mm and MinZ derived at 112.3 mm, the closest return across 297 frames was
      # 112 mm exactly (median and 5th percentile also 112). Setting the floor at MinZ
      # would have made that unfalsifiable, and it buys nothing — the disparity search
      # cannot produce a closer value in the first place.
      threshold: {enable: true,  min_range_mm: 100, max_range_mm: 3000}
  max_disparity: 95                   # must agree with extended_disparity: false

warp:
  # Do not throw the resolution away one stage later. The C3 target model is 1280x800
  # native, so this is its own grid rather than an upsample.
  target_size: [1280, 800]
